volumes:
  f1_postgres_data:
    driver: local
  kestra_postgres_data:
    driver: local
  kestra_data:
    driver: local
  kestra_tmp:
    driver: local
  pgadmin_data:
    driver: local

services:

  #Postgres databse for the f1 data
  pgdatabase:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${F1_DB_USER}
      POSTGRES_PASSWORD: ${F1_DB_PASSWORD}
      POSTGRES_DB: ${F1_DB_NAME}
    volumes:
      - f1_postgres_data:/var/lib/postgresql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"


    #pgAdmin - GUI for inspecting/quering the database
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8050:80"
    depends_on:
      - pgdatabase
      
  #PostgrsSQL database for the kestra data
  kestra_pgdatabase:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${KESTRA_DB_USER}
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD}
      POSTGRES_DB: ${KESTRA_DB_NAME}
    volumes:
      - kestra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5


  # Kestra - workflow orchestration engine
  kestra:
    image: kestra/kestra:v1.1
    pull_policy: always
    user: "root"
    command: server standalone

    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - kestra_tmp:/tmp/kestra-wd

    environment:
      ENV_KESTRA_F1_RAW_DATA_PATH: ${F1_RAW_DATA_PATH}
      ENV_F1_DB_USER: ${F1_DB_USER}
      ENV_F1_DB_PASSWORD: ${F1_DB_PASSWORD}
      ENV_F1_DB_NAME: ${F1_DB_NAME}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra_pgdatabase:5432/${KESTRA_DB_NAME}
            driverClassName: org.postgresql.Driver
            username: ${KESTRA_DB_USER}
            password: ${KESTRA_DB_PASSWORD}

        kestra:
          repository:
            type: postgres

          storage:
            type: local
            local:
              basePath: "/app/storage"

          queue:
            type: postgres

          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp

          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true

          url: http://localhost:8080/

    ports:
      - "8080:8080"

    depends_on:
      kestra_pgdatabase:
        condition: service_healthy
  